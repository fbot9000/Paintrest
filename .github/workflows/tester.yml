# Tester og bygg ved hver push til main (O-12). En rød main vises på GitHub.
name: Tester og bygg

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tester-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
